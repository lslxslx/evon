<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Shkresa e ngarkesës mësimore</title>
  <style>
    body { margin: 24px; font: 16px Arial, sans-serif; line-height: 1.5; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <p id="status" role="status">Po përgatitet shkresa…</p>
  <script>
    'use strict';
    try {
      const id = location.hash.slice(1);
      if (!/^[a-f0-9-]{36}$/i.test(id)) {
        throw new Error('Hapeni shkresën nga butoni “Gjenero shkresën” te përmbledhja.');
      }
      const sessionKey = 'evion-letter-' + id;
      const transferKey = 'evion-letter-transfer-' + id;
      let serialized = sessionStorage.getItem(sessionKey);
      const fromTransfer = !serialized;
      if (!serialized) serialized = localStorage.getItem(transferKey);
      if (!serialized) {
        throw new Error('Të dhënat mungojnë. Gjenerojeni përsëri shkresën nga përmbledhja.');
      }
      const snapshot = JSON.parse(serialized);
      if (!snapshot || typeof snapshot.html !== 'string') {
        throw new Error('Të dhënat e shkresës janë të pavlefshme.');
      }
      if (fromTransfer && (!Number.isFinite(snapshot.createdAt) ||
          Date.now() - snapshot.createdAt > 15 * 60 * 1000)) {
        localStorage.removeItem(transferKey);
        throw new Error('Afati i hapjes përfundoi. Gjenerojeni shkresën përsëri.');
      }
      const parsed = new DOMParser().parseFromString(snapshot.html, 'text/html');
      if (!parsed.querySelector('.paper')) {
        throw new Error('Përmbajtja e shkresës mungon.');
      }
      // Ruhet kopja e kësaj skede për rifreskim dhe printime të përsëritura.
      sessionStorage.setItem(sessionKey, serialized);
      try { localStorage.removeItem(transferKey); } catch {}
      document.title = parsed.title || 'Shkresa e ngarkesës mësimore';
      document.head.querySelectorAll('style').forEach(node => node.remove());
      parsed.head.querySelectorAll('style').forEach(node => {
        document.head.appendChild(document.importNode(node, true));
      });
      // Dokumenti i gjeneruar përmban vetëm paraqitjen, pa kod ekzekutues.
      parsed.body.querySelectorAll('script, iframe, object, embed, base').forEach(node => node.remove());
      parsed.body.querySelectorAll('*').forEach(node => {
        Array.from(node.attributes).forEach(attribute => {
          if (/^on/i.test(attribute.name)) node.removeAttribute(attribute.name);
        });
      });
      const content = document.createDocumentFragment();
      Array.from(parsed.body.childNodes).forEach(node => {
        content.appendChild(document.importNode(node, true));
      });
      document.body.replaceChildren(content);
    } catch (error) {
      const message = document.getElementById('status');
      if (message) message.textContent = 'Shkresa nuk u hap: ' + error.message;
    }
  </script>
</body>
</html>
